[[imports]]
source_id = "video-shotcraft-upstream"
source = "https://github.com/Vincentwei1021/video-shotcraft"
revision = "5e71af35a2daee492dd3ea93e5e8903f32dcd13c"
destination = "library/media/video/video-shotcraft"
selection = "complete upstream tree at the pinned revision, including assets; upstream .git metadata omitted"
license = "Apache-2.0"
license_file = "library/media/video/video-shotcraft/LICENSE"
notes = "The upstream LICENSE is preserved verbatim. Audio assets under assets/audio/ (bgm and sfx mp3s) are not covered by Apache-2.0; each is governed by its own attribution/license terms as recorded in assets/audio/ATTRIBUTION.md (Mixkit free licenses; several sfx rows are marked untraceable and need confirmation before commercial use)."

[[variants]]
runtime_name = "thermo-nuclear-code-quality-review"
source = "~/project-a/.claude/skills/thermo-nuclear-code-quality-review"
destination = "variants/project-a/engineering/thermo-nuclear-code-quality-review"
reason = "Differs from canonical source by a trailing newline; preserved rather than normalized."

[excluded]
paths = [
  "~/.codex/skills/.system",
  "~/.codex/plugins/cache",
  "https://github.com/Vincentwei1021/video-shotcraft (.git metadata; the working tree is vendored, the repository history is not)",
]
reason = "Vendor defaults, plugin caches, and nested VCS metadata are not catalog skill content."

[[imports]]
source_id = "marketing-workspace-ebook-carousel"
source = "marketing-startegy/skills/ebook-carousel"
destination = "library/content/carousels/ebook-carousel"
selection = "Complete project-authored skill; bytecode caches omitted; portable publisher inputs replace local paths and account defaults"
revision_manifest = "library/content/carousels/ebook-carousel/references/import-provenance.json"
notes = "Imported with user authorization for skillshelf redistribution. No production assets, metrics, secrets, or third-party skill source vendored. Optional external references remain links. Local 2026-10-03 update aligns five-to-six-slide 9:16 defaults and routes project work to its own canonical skill; original import hashes remain in the revision manifest."

[[imports]]
source_id = "claude-video-watch-upstream"
source = "https://github.com/bradautomates/claude-video/tree/03ceb42f7fa2c4439aca01752118044baabffb8f/skills/watch"
revision = "03ceb42f7fa2c4439aca01752118044baabffb8f"
destination = "library/media/video/watch"
selection = "Complete skills/watch directory, byte-identical to upstream, plus upstream root LICENSE"
license = "MIT"
license_file = "library/media/video/watch/LICENSE"
notes = "Imported 2026-10-04 using skill-installer; all 11 skill files verified against pinned upstream. Runtime engines and transcription backends require first-use setup; no credentials or models included."
