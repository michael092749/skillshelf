# Repeat for each exact config subtree written by the workflow.
#[[config_ownership]]
#host = "codex"
#file = ".codex/config.toml"
#key = "mcp_servers.n8n"
#sha256 = "REPLACE_WITH_CANONICAL_VALUE_HASH"

# Canonical value hash = SHA-256 of compact UTF-8 JSON with keys sorted; the
# validator stringifies TOML-native non-JSON scalar types consistently.

#[[config_ownership]]
#host = "claude"
#file = ".mcp.json"
#key = "mcpServers.n8n"
#sha256 = "REPLACE_WITH_CANONICAL_VALUE_HASH"

# Record only context files created by the workflow, not pre-existing files.
#[[owned_files]]
#kind = "context"
#path = "AGENTS.md"
#sha256 = "REPLACE_WITH_FILE_HASH"

